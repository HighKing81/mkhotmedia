default vesamenu.c32

timeout 100
menu background splash.jpg
menu title Welcome to HotMedia!
menu color border 0 #ffffffff #00000000
menu color sel 0 #80ffffff #20ffffff
menu color title 0 #ffffffff #00000000
menu color tabmsg 0 #ffffffff #00000000
menu color unsel 0 #ffffffff #00000000
menu color hotsel 0 #ff000000 #ffffffff
menu color hotkey 0 #ffffffff #ff000000
label hotmedia
menu label Boot with default settings
    kernel vmlinuz
    append livecd=livecd initrd=initrd.img root=/dev/rd/3 vga=788 keyb=us splash=verbose
label copy2ram
menu label Copy2ram: copying entire system to RAM
    kernel vmlinuz
    append livecd=livecd initrd=initrd.img root=/dev/rd/3 vga=788 keyb=us splash=verbose copy2ram
label vesa
menu label Use VESA video driver (if autodetection fails)
    kernel vmlinuz
    append livecd=livecd initrd=initrd.img root=/dev/rd/3 vga=788 keyb=us splash=verbose vesa
label useswap
menu label Use local swap partition(s) (if low on memory)
    kernel vmlinuz
    append livecd=livecd initrd=initrd.img root=/dev/rd/3 vga=788 keyb=us splash=verbose useswap
label harddisk
menu label Boot from harddisk
   localboot 0x80
